<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mapa Mundial de Data Centers</title>
  <meta name="description" content="Globo 3D interativo com a localização dos principais data centers do mundo.">

  <!-- Prévia do link em WhatsApp e redes sociais -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Mapa Mundial de Data Centers">
  <meta property="og:description" content="Gire o globo 3D e descubra a história dos data centers de Google, Meta, Microsoft, AWS, Apple e outras empresas.">
  <meta property="og:url" content="https://luizapleite.github.io/datacenters/">
  <meta property="og:image" content="https://luizapleite.github.io/datacenters/img/preview.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="420">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="pagina-globo">

  <header class="topo">
    <div class="topo__titulo">
      <h1>Mapa Mundial de Data Centers</h1>
      <p class="topo__sub">Arraste para girar o globo e toque em um pin ou ponto.</p>
    </div>

    <!-- Barra de pesquisa: data center, empresa, cidade ou país -->
    <div class="busca" role="search">
      <svg class="busca__icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="busca" class="busca__campo" type="search" autocomplete="off" spellcheck="false"
             placeholder="Pesquisar data center, empresa, cidade ou país"
             aria-label="Pesquisar data center, empresa, cidade ou país"
             role="combobox" aria-expanded="false" aria-controls="busca-resultados" aria-autocomplete="list">
      <button type="button" class="busca__limpar" aria-label="Limpar pesquisa" hidden>&times;</button>
      <div id="busca-resultados" class="busca__resultados" role="listbox" hidden></div>
    </div>

    <!-- Filtros de camadas -->
    <div class="filtros" role="group" aria-label="Filtros do mapa">
      <button type="button" class="filtro" data-filtro="destaques" aria-pressed="true">Destaques</button>
      <button type="button" class="filtro" data-filtro="todos" aria-pressed="true">Todos os data centers</button>
      <button type="button" class="filtro filtro--ia" data-filtro="ia" aria-pressed="false">Só IA</button>
    </div>
  </header>

  <!-- Container do Globe.gl -->
  <main id="globo" aria-label="Globo 3D com data centers"></main>

  <!-- Lista de data centers de uma cidade ou país (preenchida via JS) -->
  <aside id="lista" class="lista" aria-live="polite" hidden>
    <div class="lista__cabecalho">
      <h2 class="lista__titulo"></h2>
      <button type="button" class="lista__fechar" aria-label="Fechar lista">&times;</button>
    </div>
    <ul class="lista__itens"></ul>
  </aside>

  <!-- Balão de informações (preenchido via JS) -->
  <aside id="balao" class="balao" role="dialog" aria-live="polite" hidden>
    <button type="button" class="balao__fechar" aria-label="Fechar">&times;</button>
    <div class="balao__cabecalho">
      <img class="balao__logo" src="" alt="">
      <div>
        <h2 class="balao__nome"></h2>
        <p class="balao__empresa"></p>
      </div>
    </div>
    <p class="balao__etiquetas"></p>
    <p class="balao__local"></p>
    <p class="balao__resumo"></p>
    <a class="botao balao__detalhes" href="#">Mais detalhes</a>
    <button type="button" class="balao__voltar" hidden>&larr; Voltar à lista</button>
  </aside>

  <div id="status" class="status" role="status">Carregando data centers…</div>

  <p class="creditos-mapa">
    Pontos: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores do OpenStreetMap</a>
  </p>

  <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
  <script src="js/dados.js?v=6"></script>
  <script src="js/busca.js?v=6"></script>
  <script src="js/app.js?v=12"></script>
</body>
</html>
